<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мадрид · выбираем места вдвоём</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..700,50&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c1a17; --paper:#f7f2e8; --tile:#e9dfcd; --line:#d9cdb6;
  --carmine:#b3232f; --ochre:#c8842a; --sky:#2b6f9e; --both:#5b8c3a; --muted:#7a7166;
  --d:#2b6f9e; --m:#b3232f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Manrope,system-ui,sans-serif;background:var(--paper);color:var(--ink)}
body{display:grid;grid-template-rows:auto 1fr;height:100vh}
header{display:flex;align-items:center;gap:20px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--paper);flex-wrap:wrap}
h1{font-family:Fraunces,serif;font-weight:400;font-size:26px;margin:0;letter-spacing:-.01em}
h1 em{font-style:italic;color:var(--carmine)}
.who{display:flex;gap:6px;margin-left:auto;align-items:center}
.who span{font-size:12px;color:var(--muted);margin-right:4px}
.who button{border:1px solid var(--line);background:#fff;padding:7px 14px;border-radius:999px;font:600 13px Manrope;cursor:pointer;color:var(--ink)}
.who button[data-p="d"].on{background:var(--d);border-color:var(--d);color:#fff}
.who button[data-p="m"].on{background:var(--m);border-color:var(--m);color:#fff}
.stats{font-size:13px;color:var(--muted);display:flex;gap:14px}
.stats b{color:var(--ink);font-weight:700}
main{display:grid;grid-template-columns:380px 1fr;min-height:0}
aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.filters button{border:1px solid var(--line);background:transparent;padding:5px 11px;border-radius:999px;font:500 12px Manrope;cursor:pointer;color:var(--muted)}
.filters button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.list{overflow:auto;padding:8px 10px 20px;flex:1}
.card{display:grid;grid-template-columns:64px 1fr auto;gap:4px 10px;padding:12px 12px;border-radius:12px;cursor:pointer;border:1px solid transparent;margin-bottom:4px}
.card:hover{background:var(--tile)}
.card.active{border-color:var(--ink)}
.card .name{font-family:Fraunces,serif;font-size:17px;line-height:1.15}
.card .cat{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:2px}
.card .desc{grid-column:2/-1;font-size:13px;color:#4a443c;line-height:1.4;margin-top:4px}
.hearts{display:flex;gap:4px;align-self:start}
.hearts button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:14px;line-height:1;color:var(--line);display:grid;place-items:center;transition:transform .12s}
.hearts button:active{transform:scale(.9)}
.hearts button[data-p="d"].on{border-color:var(--d);color:var(--d);background:#e8f0f7}
.hearts button[data-p="m"].on{border-color:var(--m);color:var(--m);background:#f9e6e7}
.card.both{background:linear-gradient(90deg,#eef4e6,transparent);}
#map{height:100%;background:var(--tile)}
.pin{width:14px;height:14px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);background:#9a9186}
.pin.d{background:var(--d)}.pin.m{background:var(--m)}
.pin.both{background:var(--both);width:20px;height:20px}
.pin.dm{background:linear-gradient(90deg,var(--d) 50%,var(--m) 50%)}
.leaflet-popup-content{font-family:Manrope;font-size:13px;margin:10px 12px}
.leaflet-popup-content b{font-family:Fraunces,serif;font-size:16px;font-weight:500;display:block;margin-bottom:2px}
.pop-hearts{display:flex;gap:6px;margin-top:8px}
.pop-hearts button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font:600 12px Manrope;cursor:pointer;color:var(--muted)}
.pop-hearts button[data-p="d"].on{border-color:var(--d);color:var(--d);background:#e8f0f7}
.pop-hearts button[data-p="m"].on{border-color:var(--m);color:var(--m);background:#f9e6e7}
.legend{position:absolute;bottom:18px;right:14px;z-index:800;background:rgba(247,242,232,.94);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;display:grid;gap:5px}
.legend div{display:flex;align-items:center;gap:8px}
.legend .pin{width:12px;height:12px}
.export{margin-left:6px;border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:999px;font:600 12px Manrope;cursor:pointer}
.mapwrap{position:relative;min-height:0}
.hint{font-size:11px;color:var(--muted);padding:6px 14px 0}
@media (max-width:820px){
  main{grid-template-columns:1fr;grid-template-rows:55vh 1fr}
  aside{border-right:0;border-top:1px solid var(--line);order:2}
  .mapwrap{order:1}
  header{gap:10px}
  h1{font-size:20px}
}

.img{width:64px;height:64px;border-radius:10px;background:var(--tile) center/cover no-repeat;grid-row:1/3}
.img.pop{width:100%;height:120px;margin-bottom:8px;display:none}
.img.pop.has{display:block}
.home{width:34px;height:34px;border-radius:50%;background:#fff;border:2px solid var(--ochre);display:grid;place-items:center;font-size:17px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.leaflet-popup-content{min-width:220px}
.tabs{display:none}
@media (max-width:820px){
  body{grid-template-rows:auto 1fr auto}
  header{padding:8px 12px;gap:8px}
  .stats{font-size:12px;gap:10px;order:3;width:100%}
  .who{margin-left:0;flex-wrap:wrap}
  .who button,.export{padding:8px 12px}
  main{display:block;position:relative;min-height:0;height:100%}
  .mapwrap{position:absolute;inset:0}
  aside{position:absolute;left:0;right:0;bottom:0;height:42%;background:var(--paper);border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.12);z-index:900;transition:height .25s}
  aside.big{height:88%}
  aside.min{height:52px}
  aside::before{content:'';display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 4px}
  .filters{padding:6px 10px;overflow-x:auto;flex-wrap:nowrap}
  .filters button{white-space:nowrap}
  .hint{display:none}
  .hearts button{width:40px;height:40px;font-size:17px}
  .card{grid-template-columns:56px 1fr auto;padding:12px 10px}
  .img{width:56px;height:56px}
  .legend{bottom:auto;top:12px;right:12px;padding:6px 10px;font-size:11px}
  .leaflet-top.leaflet-left .leaflet-control-zoom{margin-top:12px}
}
</style>
</head>
<body>
<header>
  <h1>Мадрид · <em>выбираем вдвоём</em></h1>
  <div class="stats"><span>Даниил <b id="cd">0</b></span><span>Милена <b id="cm">0</b></span><span>Совпало <b id="cb">0</b></span></div>
  <div class="who">
    <span>Кто кликает:</span>
    <button data-p="d" class="on">Даниил</button>
    <button data-p="m">Милена</button>
    <button class="export" id="share">Поделиться ссылкой</button><button class="export" id="exp">Скопировать список</button>
  </div>
</header>
<main>
  <aside>
    <div class="filters" id="filters"></div>
    <div class="hint">Клик по карточке — показать на карте. Сердечки — кто что хочет.</div>
    <div class="list" id="list"></div>
  </aside>
  <div class="mapwrap">
    <div id="map"></div>
    <div class="legend">
      <div><i class="pin"></i> никто не отметил</div>
      <div><i class="pin d"></i> Даниил</div>
      <div><i class="pin m"></i> Милена</div>
      <div><i class="pin both"></i> оба — точно идём</div>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const PLACES=[
 {id:'prado',w:'Museo del Prado',n:'Музей Прадо',c:'Музеи',lat:40.4138,lng:-3.6921,d:'Веласкес, Гойя, Босх. Бесплатный вход вечером за 2 часа до закрытия — но очередь.'},
 {id:'reina',w:'Museo Reina Sofía',n:'Центр искусств королевы Софии',c:'Музеи',lat:40.4080,lng:-3.6946,d:'«Герника» Пикассо, Дали, Миро. Современное искусство в бывшем госпитале.'},
 {id:'thyssen',w:'Museo Thyssen-Bornemisza',n:'Музей Тиссена-Борнемисы',c:'Музеи',lat:40.4160,lng:-3.6949,d:'Частная коллекция от готики до поп-арта. Спокойнее Прадо.'},
 {id:'sorolla',w:'Museo Sorolla',n:'Музей Сорольи',c:'Музеи',lat:40.4356,lng:-3.6924,d:'Дом-мастерская художника света с андалузским садиком. Камерно и очень красиво.'},
 {id:'retiro',w:'Parque del Retiro',n:'Парк Ретиро',c:'Парки и виды',lat:40.4153,lng:-3.6844,d:'Лодки на пруду, Хрустальный дворец, розарий. Идеально после Прадо.'},
 {id:'debod',w:'Templo de Debod',n:'Храм Дебод',c:'Парки и виды',lat:40.4240,lng:-3.7178,d:'Настоящий египетский храм и лучший закат в городе.'},
 {id:'palacio',w:'Palacio Real de Madrid',n:'Королевский дворец',c:'Достопримечательности',lat:40.4179,lng:-3.7143,d:'Самый большой дворец Западной Европы. Рядом сады Сабатини и собор Альмудена.'},
 {id:'mayor',w:'Plaza Mayor de Madrid',n:'Пласа-Майор',c:'Достопримечательности',lat:40.4155,lng:-3.7074,d:'Главная площадь с фресками. Бокадильо с кальмарами в переулках рядом.'},
 {id:'sol',w:'Puerta del Sol',n:'Пуэрта-дель-Соль',c:'Достопримечательности',lat:40.4169,lng:-3.7035,d:'Километр ноль Испании и медведь с земляничным деревом.'},
 {id:'granvia',w:'Gran Vía (Madrid)',n:'Гран-Виа',c:'Достопримечательности',lat:40.4200,lng:-3.7050,d:'Мадридский Бродвей: здание Метрополис, магазины, крыши-террасы.'},
 {id:'cibeles',w:'Palacio de Cibeles',n:'Дворец Сибелес',c:'Парки и виды',lat:40.4190,lng:-3.6924,d:'Смотровая площадка на крыше бывшего почтамта — панорама за пару евро.'},
 {id:'sanmiguel',w:'Mercado de San Miguel',n:'Рынок Сан-Мигель',c:'Еда',lat:40.4154,lng:-3.7089,d:'Гурмэ-рынок под стеклом: тапас, вермут, устрицы. Туристично, но вкусно.'},
 {id:'sanmiguel2',w:'Mercado de San Antón',n:'Рынок Сан-Антон',c:'Еда',lat:40.4227,lng:-3.6980,d:'Рынок в Чуэке с террасой на крыше и меньшим количеством туристов.'},
 {id:'botin',w:'Sobrino de Botín',n:'Sobrino de Botín',c:'Еда',lat:40.4142,lng:-3.7079,d:'Старейший ресторан мира (1725). Молочный поросёнок и Хемингуэй.'},
 {id:'chocolat',w:'Chocolatería San Ginés',n:'Chocolatería San Ginés',c:'Еда',lat:40.4166,lng:-3.7067,d:'Чуррос с шоколадом с 1894 года, работает почти круглосуточно.'},
 {id:'lalatina',w:'La Latina',n:'Ла-Латина: Cava Baja',c:'Еда',lat:40.4123,lng:-3.7098,d:'Улица тапас-баров. Воскресный вермут — местная религия.'},
 {id:'malasana',w:'Malasaña',n:'Маласанья',c:'Районы',lat:40.4256,lng:-3.7043,d:'Хипстерский район: винтаж, кофе, бары, граффити. Плаза Дос-де-Майо.'},
 {id:'chueca',w:'Chueca',n:'Чуэка',c:'Районы',lat:40.4225,lng:-3.6975,d:'Яркий, весёлый район с террасами и дизайнерскими магазинами.'},
 {id:'lavapies',w:'Lavapiés',n:'Лавапьес',c:'Районы',lat:40.4085,lng:-3.7010,d:'Мультикультурный квартал: индийская еда, стрит-арт, Табакалера.'},
 {id:'salamanca',w:'Salamanca (Madrid)',n:'Саламанка',c:'Районы',lat:40.4290,lng:-3.6820,d:'Богатый район с бутиками на Серрано и красивой архитектурой.'},
 {id:'rastro',w:'El Rastro',n:'Эль-Растро',c:'Рынки и винтаж',lat:40.4095,lng:-3.7080,d:'Огромная воскресная барахолка: антиквариат, посуда, старьё. Только по воскресеньям.'},
 {id:'bernabeu',w:'Estadio Santiago Bernabéu',n:'Стадион Сантьяго Бернабеу',c:'Достопримечательности',lat:40.4531,lng:-3.6883,d:'Обновлённый стадион Реала, тур и музей.'},
 {id:'matadero',w:'Matadero Madrid',n:'Матадеро',c:'Парки и виды',lat:40.3922,lng:-3.6980,d:'Бывшая скотобойня → культурный центр у реки. Мадрид-Рио рядом.'},
 {id:'atocha',w:'Estación de Atocha',n:'Вокзал Аточа',c:'Достопримечательности',lat:40.4067,lng:-3.6905,d:'Тропический сад с черепахами внутри вокзала XIX века.'},
 {id:'lasventas',w:'Plaza de toros de Las Ventas',n:'Лас-Вентас',c:'Достопримечательности',lat:40.4321,lng:-3.6631,d:'Арена в неомавританском стиле — можно просто посмотреть снаружи и музей.'},
 {id:'casacampo',w:'Teleférico de Madrid',n:'Каса-де-Кампо (канатка)',c:'Парки и виды',lat:40.4190,lng:-3.7315,d:'Канатная дорога от парка Оэсте над городом, озеро и виды на дворец.'},
 {id:'toledo',w:'Toledo (España)',n:'Толедо (день)',c:'Поездки за город',lat:39.8628,lng:-4.0273,d:'30 минут на поезде: средневековый город на скале, собор, Эль Греко.'},
 {id:'segovia',w:'Segovia',n:'Сеговия (день)',c:'Поездки за город',lat:40.9481,lng:-4.1184,d:'Римский акведук и замок-Диснейленд Алькасар. Поросёнок в Mesón de Cándido.'},
];
const HOME={lat:40.4258,lng:-3.7137,n:'Наш Airbnb',a:'Calle de la Princesa, 22'};
const CATS=['Все',...new Set(PLACES.map(p=>p.c))];
let who='d', filter='Все', votes={};
const KEY='madrid-votes';

function enc(){return btoa(unescape(encodeURIComponent(JSON.stringify(votes)))).replace(/=+$/,'')}
function dec(h){try{return JSON.parse(decodeURIComponent(escape(atob(h))))}catch(e){return null}}
async function load(){
  try{const l=localStorage.getItem(KEY);if(l)votes=JSON.parse(l)}catch(e){}
  const h=location.hash.slice(1);if(h){const v=dec(h);if(v){for(const k in v){votes[k]={d:!!(st(k).d||v[k].d),m:!!(st(k).m||v[k].m)}}save()}}
}
async function save(){try{localStorage.setItem(KEY,JSON.stringify(votes))}catch(e){}history.replaceState(null,'','#'+enc())}
function st(id){return votes[id]||{d:false,m:false}}
function cls(id){const v=st(id);return v.d&&v.m?'both':v.d?'d':v.m?'m':''}

const map=L.map('map',{zoomControl:true}).setView([40.4168,-3.7038],13);
const tiles=L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap &copy; CARTO',maxZoom:19}).addTo(map);
let tileFail=0;tiles.on('tileerror',()=>{if(++tileFail===3){const n=document.createElement('div');n.style.cssText='position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:900;background:#fff;border:1px solid #d9cdb6;border-radius:10px;padding:8px 14px;font-size:13px;max-width:90%';n.textContent='Карта не грузится в этом окне — скачай файл и открой его в браузере, там всё работает.';document.querySelector('.mapwrap').appendChild(n)}});
tiles.on('tileload',()=>{tileFail=-999});
const homeIcon=L.divIcon({className:'',html:'<div class="home">🏠</div>',iconSize:[34,34],iconAnchor:[17,17]});
L.marker([HOME.lat,HOME.lng],{icon:homeIcon,zIndexOffset:1000}).addTo(map).bindPopup('<b>Наш Airbnb</b>Calle de la Princesa, 22<br>Centro, 28008 Madrid');
function km(a){const R=6371,dLat=(a.lat-HOME.lat)*Math.PI/180,dLng=(a.lng-HOME.lng)*Math.PI/180;const x=Math.sin(dLat/2)**2+Math.cos(HOME.lat*Math.PI/180)*Math.cos(a.lat*Math.PI/180)*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function dist(p){const d=km(p);return d<1?Math.round(d*1000)+' м':d.toFixed(1)+' км'}
const markers={};
PLACES.forEach(p=>{
  const mk=L.marker([p.lat,p.lng],{icon:icon(p.id)}).addTo(map).bindPopup(()=>popup(p));
  mk.on('click',()=>highlight(p.id));
  markers[p.id]=mk;
});
function icon(id){return L.divIcon({className:'',html:`<div class="pin ${cls(id)}"></div>`,iconSize:[20,20],iconAnchor:[10,10]})}
function popup(p){const v=st(p.id);const el=document.createElement('div');
 el.innerHTML=`<div class="img pop" data-img="${p.id}"></div><b>${p.n}</b><span style="color:#7a7166;font-size:11px;text-transform:uppercase;letter-spacing:.08em">${p.c} · ${dist(p)} от дома</span><div style="margin-top:6px">${p.d}</div>
 <div class="pop-hearts"><button data-p="d" class="${v.d?'on':''}">♥ Даниил</button><button data-p="m" class="${v.m?'on':''}">♥ Милена</button></div>`;
 el.querySelectorAll('button').forEach(b=>b.onclick=e=>{e.stopPropagation();toggle(p.id,b.dataset.p);b.classList.toggle('on')});
 fillImgs(el);
 return el}

const imgCache={};
async function thumb(p){if(imgCache[p.id]!==undefined)return imgCache[p.id];imgCache[p.id]=null;
 for(const lang of ['es','en']){try{const r=await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(p.w)}`);if(!r.ok)continue;const j=await r.json();
  const src=(j.originalimage&&j.originalimage.source)||(j.thumbnail&&j.thumbnail.source);if(src){imgCache[p.id]=src.replace(/\/\d+px-/,'/640px-');break}}catch(e){}}
 return imgCache[p.id]}
function fillImgs(root){root.querySelectorAll('[data-img]').forEach(async el=>{const p=PLACES.find(x=>x.id===el.dataset.img);const u=await thumb(p);if(u){el.style.backgroundImage=`url("${u}")`;el.classList.add('has')}})}
function toggle(id,p){votes[id]={...st(id)};votes[id][p]=!votes[id][p];save();render()}
function highlight(id){document.querySelectorAll('.card').forEach(c=>c.classList.toggle('active',c.dataset.id===id));
 const c=document.querySelector(`.card[data-id="${id}"]`);if(c)c.scrollIntoView({block:'nearest',behavior:'smooth'})}

function render(){
  document.getElementById('filters').innerHTML=CATS.map(c=>`<button class="${c===filter?'on':''}" data-c="${c}">${c}</button>`).join('');
  document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{filter=b.dataset.c;render()});
  const list=document.getElementById('list');
  list.innerHTML=PLACES.filter(p=>filter==='Все'||p.c===filter).map(p=>{const v=st(p.id);return`
   <div class="card ${v.d&&v.m?'both':''}" data-id="${p.id}">
     <div class="img" data-img="${p.id}"></div>
     <div><div class="name">${p.n}</div><div class="cat">${p.c} · ${dist(p)} от дома</div></div>
     <div class="hearts"><button data-p="d" class="${v.d?'on':''}" title="Даниил">♥</button><button data-p="m" class="${v.m?'on':''}" title="Милена">♥</button></div>
     <div class="desc">${p.d}</div></div>`}).join('');
  fillImgs(list);
  list.querySelectorAll('.card').forEach(c=>{
    c.onclick=()=>{const p=PLACES.find(x=>x.id===c.dataset.id);map.flyTo([p.lat,p.lng],p.c==='Поездки за город'?10:15,{duration:.8});markers[p.id].openPopup();highlight(p.id)};
    c.querySelectorAll('.hearts button').forEach(b=>b.onclick=e=>{e.stopPropagation();toggle(c.dataset.id,b.dataset.p)});
  });
  PLACES.forEach(p=>{const mk=markers[p.id];mk.setIcon(icon(p.id));const show=filter==='Все'||p.c===filter;if(show&&!map.hasLayer(mk))mk.addTo(map);if(!show&&map.hasLayer(mk)){mk.closePopup();map.removeLayer(mk)}});
  let cd=0,cm=0,cb=0;PLACES.forEach(p=>{const v=st(p.id);if(v.d)cd++;if(v.m)cm++;if(v.d&&v.m)cb++});
  cd_.textContent=cd;cm_.textContent=cm;cb_.textContent=cb;
}
const cd_=document.getElementById('cd'),cm_=document.getElementById('cm'),cb_=document.getElementById('cb');
document.querySelectorAll('.who button[data-p]').forEach(b=>b.onclick=()=>{who=b.dataset.p;document.querySelectorAll('.who button[data-p]').forEach(x=>x.classList.toggle('on',x===b))});
// клик по маркеру с зажатым Alt/двойной клик — быстрая отметка от текущего человека
PLACES.forEach(p=>markers[p.id].on('dblclick',()=>toggle(p.id,who)));
document.getElementById('exp').onclick=async()=>{
  const both=PLACES.filter(p=>st(p.id).d&&st(p.id).m).map(p=>'• '+p.n);
  const d=PLACES.filter(p=>st(p.id).d&&!st(p.id).m).map(p=>'• '+p.n);
  const m=PLACES.filter(p=>st(p.id).m&&!st(p.id).d).map(p=>'• '+p.n);
  const txt=`МАДРИД — наш список\n\nОба хотим:\n${both.join('\n')||'—'}\n\nТолько Даниил:\n${d.join('\n')||'—'}\n\nТолько Милена:\n${m.join('\n')||'—'}`;
  try{await navigator.clipboard.writeText(txt);exp.textContent='Скопировано ✓';setTimeout(()=>exp.textContent='Скопировать список',1500)}catch(e){alert(txt)}
};
document.getElementById('share').onclick=async()=>{const u=location.origin+location.pathname+'#'+enc();try{await navigator.clipboard.writeText(u);share.textContent='Ссылка скопирована ✓';setTimeout(()=>share.textContent='Поделиться ссылкой',1500)}catch(e){prompt('Ссылка:',u)}};
(function(){const a=document.querySelector('aside');const states=['min','','big'];let i=1;
 a.addEventListener('click',e=>{const r=a.getBoundingClientRect();if(e.clientY-r.top<20){i=(i+1)%3;a.className=states[i]}});
 let y0=null;a.addEventListener('touchstart',e=>{const r=a.getBoundingClientRect();y0=(e.touches[0].clientY-r.top<28)?e.touches[0].clientY:null},{passive:true});
 a.addEventListener('touchend',e=>{if(y0===null)return;const dy=e.changedTouches[0].clientY-y0;if(dy<-40&&i<2)i++;else if(dy>40&&i>0)i--;a.className=states[i];y0=null});
})();
map.on('popupopen',()=>{if(innerWidth<=820)document.querySelector('aside').className='min'});
load().then(render);
</script>
