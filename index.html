<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мадрид · выбираем места вдвоём</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..700,50&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c1a17; --paper:#f7f2e8; --tile:#e9dfcd; --line:#d9cdb6;
  --carmine:#b3232f; --ochre:#c8842a; --sky:#2b6f9e; --both:#4f7f2f; --muted:#7a7166;
  --d:#2b6f9e; --m:#b3232f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Manrope,system-ui,sans-serif;background:var(--paper);color:var(--ink)}
body{display:grid;grid-template-rows:auto 1fr;height:100vh}
header{display:flex;align-items:center;gap:16px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--paper);flex-wrap:wrap}
h1{font-family:Fraunces,serif;font-weight:400;font-size:24px;margin:0;letter-spacing:-.01em;white-space:nowrap}
h1 em{font-style:italic;color:var(--carmine)}
.stats{font-size:13px;color:var(--muted);display:flex;gap:12px;align-items:center}
.stats b{font-weight:700}
.stats .sd b{color:var(--d)}.stats .sm b{color:var(--m)}.stats .sb b{color:var(--both)}
.who{display:flex;gap:6px;margin-left:auto;align-items:center;flex-wrap:wrap}
.who>span{font-size:12px;color:var(--muted)}
.who button[data-p]{border:1.5px solid var(--line);background:#fff;padding:6px 14px;border-radius:999px;font:600 13px Manrope;cursor:pointer;color:var(--muted)}
.who button[data-p="d"].on{background:var(--d);border-color:var(--d);color:#fff}
.who button[data-p="m"].on{background:var(--m);border-color:var(--m);color:#fff}
.export{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:999px;font:600 12px Manrope;cursor:pointer;color:var(--ink)}
.sync{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:block}
.sync.ok i{background:var(--both)}
.sync.err i{background:var(--carmine)}
.sync.local i{background:var(--ochre)}

main{display:grid;grid-template-columns:400px 1fr;min-height:0}
aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--paper)}
.viewtabs{display:flex;gap:0;padding:10px 14px 0}
.viewtabs button{flex:1;border:1px solid var(--line);background:#fff;padding:8px 10px;font:600 13px Manrope;cursor:pointer;color:var(--muted)}
.viewtabs button:first-child{border-radius:9px 0 0 9px}
.viewtabs button:last-child{border-radius:0 9px 9px 0;border-left:0}
.viewtabs button.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.searchwrap{padding:10px 14px 0}
.search{width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;font:400 14px Manrope;color:var(--ink)}
.search:focus{outline:2px solid var(--ochre);outline-offset:-1px}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.filters button{border:1px solid var(--line);background:transparent;padding:5px 11px;border-radius:999px;font:500 12px Manrope;cursor:pointer;color:var(--muted)}
.filters button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.list{overflow:auto;padding:8px 10px 24px;flex:1}
.gtitle{font-family:Fraunces,serif;font-size:15px;padding:14px 8px 6px;display:flex;align-items:center;gap:8px}
.gtitle .n{font-family:Manrope;font-size:11px;font-weight:700;color:var(--muted)}
.gtitle.both{color:var(--both)}.gtitle.d{color:var(--d)}.gtitle.m{color:var(--m)}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}

.card{display:grid;grid-template-columns:64px 1fr auto;gap:3px 10px;padding:11px 12px;border-radius:12px;cursor:pointer;border:1px solid transparent;margin-bottom:3px}
.card:hover{background:var(--tile)}
.card.active{border-color:var(--ink)}
.card .name{font-family:Fraunces,serif;font-size:17px;line-height:1.15}
.card .cat{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-top:2px}
.card .desc{grid-column:2/-1;font-size:13px;color:#4a443c;line-height:1.4;margin-top:4px}
.card.both{background:linear-gradient(90deg,#eaf2e2,transparent 70%)}
.card.both:hover{background:linear-gradient(90deg,#e2ecd7,var(--tile) 70%)}
.marks{grid-column:2/-1;display:flex;gap:6px;align-items:center;margin-top:5px;flex-wrap:wrap}
.mk{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;letter-spacing:.01em}
.mk.d{background:#e3edf5;color:var(--d)}
.mk.m{background:#f7e4e5;color:var(--m)}
.mk.both{background:#e4efd9;color:var(--both)}

.hearts{display:flex;gap:5px;align-self:start}
.hearts button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:#fff;cursor:pointer;font:700 12px Manrope;color:#b8b0a4;display:grid;place-items:center;transition:transform .12s}
.hearts button:active{transform:scale(.88)}
.hearts button[data-p="d"].on{border-color:var(--d);color:#fff;background:var(--d)}
.hearts button[data-p="m"].on{border-color:var(--m);color:#fff;background:var(--m)}

#map{height:100%;background:var(--tile)}
.pin{width:13px;height:13px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);background:#9a9186}
.pin.d{background:var(--d)}.pin.m{background:var(--m)}
.pin.both{background:var(--both);width:20px;height:20px}
.leaflet-popup-content{font-family:Manrope;font-size:13px;margin:10px 12px;min-width:230px}
.leaflet-popup-content b{font-family:Fraunces,serif;font-size:16px;font-weight:500;display:block;margin-bottom:2px}
.pop-hearts{display:flex;gap:6px;margin-top:9px}
.pop-hearts button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font:600 12px Manrope;cursor:pointer;color:var(--muted)}
.pop-hearts button[data-p="d"].on{border-color:var(--d);color:#fff;background:var(--d)}
.pop-hearts button[data-p="m"].on{border-color:var(--m);color:#fff;background:var(--m)}
.legend{position:absolute;bottom:18px;right:14px;z-index:800;background:rgba(247,242,232,.94);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;display:grid;gap:5px}
.legend div{display:flex;align-items:center;gap:8px}
.legend .pin{width:12px;height:12px}
.mapwrap{position:relative;min-height:0}
.img{width:64px;height:64px;border-radius:10px;background:var(--tile) center/cover no-repeat;grid-row:1/3}
.img.pop{width:100%;height:130px;margin-bottom:8px;display:none;border-radius:8px}
.img.pop.has{display:block}
.home{width:34px;height:34px;border-radius:50%;background:#fff;border:2px solid var(--ochre);display:grid;place-items:center;font-size:17px;box-shadow:0 2px 6px rgba(0,0,0,.3)}

@media (max-width:820px){
  body{grid-template-rows:auto 1fr}
  header{padding:8px 12px;gap:8px}
  h1{font-size:19px}
  .stats{font-size:12px;gap:9px;order:3;width:100%}
  .who{margin-left:0;flex-wrap:wrap;gap:5px}
  .who button[data-p],.export{padding:7px 11px}
  main{display:block;position:relative;min-height:0;height:100%}
  .mapwrap{position:absolute;inset:0}
  aside{position:absolute;left:0;right:0;bottom:0;height:46%;border-right:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.12);z-index:900;transition:height .25s}
  aside.big{height:90%}
  aside.min{height:52px}
  aside::before{content:'';display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
  .viewtabs{padding:8px 10px 0}
  .searchwrap{padding:8px 10px 0}
  .filters{padding:8px 10px;overflow-x:auto;flex-wrap:nowrap}
  .filters button{white-space:nowrap}
  .hearts button{width:42px;height:42px;font-size:13px}
  .card{grid-template-columns:56px 1fr auto;padding:11px 8px}
  .img{width:56px;height:56px}
  .legend{bottom:auto;top:12px;right:12px;padding:6px 10px;font-size:11px}
  .leaflet-top.leaflet-left .leaflet-control-zoom{margin-top:12px}
}
</style>
</head>
<body>
<header>
  <h1>Мадрид · <em>выбираем вдвоём</em></h1>
  <div class="stats">
    <span class="sd">Даниил <b id="cd">0</b></span>
    <span class="sm">Милена <b id="cm">0</b></span>
    <span class="sb">Совпало <b id="cb">0</b></span>
    <span class="sync local" id="sync"><i></i><em id="syncTxt">локально</em></span>
  </div>
  <div class="who">
    <span>Я —</span>
    <button data-p="d" class="on">Даниил</button>
    <button data-p="m">Милена</button>
    <button class="export" id="share">Ссылка</button>
    <button class="export" id="exp">Скопировать список</button>
  </div>
</header>
<main>
  <aside>
    <div class="viewtabs">
      <button data-v="all" class="on">Все места <span id="nAll"></span></button>
      <button data-v="fav">♥ Наш список <span id="nFav"></span></button>
    </div>
    <div class="searchwrap"><input class="search" id="q" placeholder="Поиск: прадо, тапас, закат…" autocomplete="off"></div>
    <div class="filters" id="filters"></div>
    <div class="list" id="list"></div>
  </aside>
  <div class="mapwrap">
    <div id="map"></div>
    <div class="legend">
      <div><i class="pin"></i> никто не отметил</div>
      <div><i class="pin d"></i> Даниил</div>
      <div><i class="pin m"></i> Милена</div>
      <div><i class="pin both"></i> оба — точно идём</div>
    </div>
  </div>
</main>

const HOME={lat:40.4258,lng:-3.7137,n:'Наш Airbnb',a:'Calle de la Princesa, 22'};
const byId={};PLACES.forEach(p=>byId[p.id]=p);
const CATS=['Все',...new Set(PLACES.map(p=>p.c))];
const NAME={d:'Даниил',m:'Милена'};
const KEY='madrid-votes', WHOKEY='madrid-who';

let who='d', filter='Все', view='all', q='', votes={};
const CLOUD=!!(SUPABASE_URL&&SUPABASE_KEY);
const pending=new Set();

function st(id){return votes[id]||{d:false,m:false}}
function cls(id){const v=st(id);return v.d&&v.m?'both':v.d?'d':v.m?'m':''}

/* ───────── сохранение ───────── */
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(votes))}catch(e){}}
function enc(){return btoa(unescape(encodeURIComponent(JSON.stringify(votes)))).replace(/=+$/,'')}
function dec(h){try{return JSON.parse(decodeURIComponent(escape(atob(h))))}catch(e){return null}}

const H={apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY};
function setSync(s,t){const el=document.getElementById('sync');el.className='sync '+s;document.getElementById('syncTxt').textContent=t}

async function pull(){
  if(!CLOUD)return;
  try{
    const r=await fetch(`${SUPABASE_URL}/rest/v1/votes?select=id,d,m`,{headers:H,cache:'no-store'});
    if(!r.ok){setSync('err','ошибка синхронизации');return}
    const rows=await r.json();
    const next={};rows.forEach(x=>{next[x.id]={d:!!x.d,m:!!x.m}});
    // отметки, которые прямо сейчас летят на сервер, локальными и остаются
    pending.forEach(id=>{next[id]=st(id)});
    votes=next;saveLocal();setSync('ok','синхронизировано');render();
  }catch(e){setSync('err','нет связи')}
}
async function push(id){
  if(!CLOUD){saveLocal();history.replaceState(null,'','#'+enc());return}
  pending.add(id);saveLocal();
  try{
    const v=st(id);
    const r=await fetch(`${SUPABASE_URL}/rest/v1/votes`,{
      method:'POST',
      headers:{...H,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},
      body:JSON.stringify({id,d:v.d,m:v.m})
    });
    setSync(r.ok?'ok':'err',r.ok?'синхронизировано':'не сохранилось');
  }catch(e){setSync('err','нет связи')}
  finally{pending.delete(id)}
}
async function load(){
  try{const l=localStorage.getItem(KEY);if(l)votes=JSON.parse(l)}catch(e){}
  try{const w=localStorage.getItem(WHOKEY);if(w==='d'||w==='m')who=w}catch(e){}
  const h=location.hash.slice(1);
  if(h){const v=dec(h);if(v){for(const k in v){votes[k]={d:!!(st(k).d||v[k].d),m:!!(st(k).m||v[k].m)}}saveLocal()}}
  if(CLOUD){
    setSync('local','синхронизация…');
    await pull();
    Object.keys(votes).forEach(id=>{if(st(id).d||st(id).m)push(id)}); // догоняем то, что было офлайн
    setInterval(pull,5000);
    addEventListener('focus',pull);
  }else{
    setSync('local','локально + по ссылке');
  }
}
function toggle(id,p){votes[id]={...st(id)};votes[id][p]=!votes[id][p];push(id);render()}

/* ───────── карта ───────── */
const map=L.map('map',{zoomControl:true}).setView([40.4168,-3.7038],13);
const tiles=L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap &copy; CARTO',maxZoom:19}).addTo(map);
let tileFail=0;tiles.on('tileerror',()=>{if(++tileFail===3){const n=document.createElement('div');n.style.cssText='position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:900;background:#fff;border:1px solid #d9cdb6;border-radius:10px;padding:8px 14px;font-size:13px;max-width:90%';n.textContent='Карта не грузится в этом окне — открой сайт в обычном браузере.';document.querySelector('.mapwrap').appendChild(n)}});
tiles.on('tileload',()=>{tileFail=-999});
const homeIcon=L.divIcon({className:'',html:'<div class="home">🏠</div>',iconSize:[34,34],iconAnchor:[17,17]});
L.marker([HOME.lat,HOME.lng],{icon:homeIcon,zIndexOffset:1000}).addTo(map).bindPopup('<b>Наш Airbnb</b>Calle de la Princesa, 22<br>Centro, 28008 Madrid');

function km(a){const R=6371,dLat=(a.lat-HOME.lat)*Math.PI/180,dLng=(a.lng-HOME.lng)*Math.PI/180;const x=Math.sin(dLat/2)**2+Math.cos(HOME.lat*Math.PI/180)*Math.cos(a.lat*Math.PI/180)*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function dist(p){const d=km(p);return d<1?Math.round(d*1000)+' м':d.toFixed(1)+' км'}
function icon(id){return L.divIcon({className:'',html:`<div class="pin ${cls(id)}"></div>`,iconSize:[20,20],iconAnchor:[10,10]})}

const markers={};
PLACES.forEach(p=>{
  const mk=L.marker([p.lat,p.lng],{icon:icon(p.id)}).addTo(map).bindPopup(()=>popup(p));
  mk.on('click',()=>highlight(p.id));
  mk.on('dblclick',()=>toggle(p.id,who));
  markers[p.id]=mk;
});

function popup(p){
  const v=st(p.id);const el=document.createElement('div');
  el.innerHTML=`<div class="img pop" data-img="${p.id}"></div><b>${p.n}</b>
   <span style="color:#7a7166;font-size:11px;text-transform:uppercase;letter-spacing:.07em">${p.c} · ${dist(p)} от дома</span>
   <div style="margin-top:6px">${p.d}</div>
   <div class="pop-hearts">
     <button data-p="d" class="${v.d?'on':''}">${v.d?'♥':'♡'} Даниил</button>
     <button data-p="m" class="${v.m?'on':''}">${v.m?'♥':'♡'} Милена</button>
   </div>`;
  el.querySelectorAll('button').forEach(b=>b.onclick=e=>{e.stopPropagation();toggle(p.id,b.dataset.p);markers[p.id].openPopup()});
  loadImg(el.querySelector('[data-img]'));
  return el;
}

/* ───────── картинки из Wikipedia, лениво ───────── */
const imgCache={};
async function thumb(p){
  if(imgCache[p.id]!==undefined)return imgCache[p.id];
  imgCache[p.id]=null;
  for(const lang of ['es','en']){
    try{
      const r=await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(p.w)}`);
      if(!r.ok)continue;
      const j=await r.json();
      const src=(j.originalimage&&j.originalimage.source)||(j.thumbnail&&j.thumbnail.source);
      if(src){imgCache[p.id]=src.replace(/\/\d+px-/,'/640px-');break}
    }catch(e){}
  }
  return imgCache[p.id];
}
async function loadImg(el){
  if(!el)return;
  const p=byId[el.dataset.img];if(!p)return;
  const u=await thumb(p);
  if(u){el.style.backgroundImage=`url("${u}")`;el.classList.add('has')}
}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);loadImg(e.target)}}),{rootMargin:'250px'});
function fillImgs(root){root.querySelectorAll('[data-img]').forEach(el=>io.observe(el))}

function highlight(id){
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('active',c.dataset.id===id));
  const c=document.querySelector(`.card[data-id="${id}"]`);
  if(c)c.scrollIntoView({block:'nearest',behavior:'smooth'});
}

/* ───────── список ───────── */
function matches(p){
  if(filter!=='Все'&&p.c!==filter)return false;
  if(!q)return true;
  const s=(p.n+' '+p.c+' '+p.d).toLowerCase();
  return s.includes(q);
}
function cardHtml(p){
  const v=st(p.id);
  let marks='';
  if(v.d&&v.m)marks='<span class="mk both">♥ хотим оба</span>';
  else if(v.d)marks='<span class="mk d">♥ Даниил</span>';
  else if(v.m)marks='<span class="mk m">♥ Милена</span>';
  return `<div class="card ${v.d&&v.m?'both':''}" data-id="${p.id}">
    <div class="img" data-img="${p.id}"></div>
    <div><div class="name">${p.n}</div><div class="cat">${p.c} · ${dist(p)} от дома</div></div>
    <div class="hearts">
      <button data-p="d" class="${v.d?'on':''}" title="Даниил">Д</button>
      <button data-p="m" class="${v.m?'on':''}" title="Милена">М</button>
    </div>
    <div class="desc">${p.d}</div>
    ${marks?`<div class="marks">${marks}</div>`:''}
  </div>`;
}
function group(title,arr,klass){
  if(!arr.length)return '';
  return `<div class="gtitle ${klass}">${title}<span class="n">${arr.length}</span></div>`+arr.map(cardHtml).join('');
}

function render(){
  // фильтры
  document.getElementById('filters').innerHTML=CATS.map(c=>`<button class="${c===filter?'on':''}" data-c="${c}">${c}</button>`).join('');
  document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{filter=b.dataset.c;render()});

  const pool=PLACES.filter(matches);
  const list=document.getElementById('list');
  let shown;

  if(view==='fav'){
    const both=pool.filter(p=>st(p.id).d&&st(p.id).m);
    const dd=pool.filter(p=>st(p.id).d&&!st(p.id).m);
    const mm=pool.filter(p=>st(p.id).m&&!st(p.id).d);
    shown=[...both,...dd,...mm];
    list.innerHTML=shown.length
      ? group('Хотим оба',both,'both')+group('Только Даниил',dd,'d')+group('Только Милена',mm,'m')
      : '<div class="empty">Здесь появится всё, что вы отметили.<br>Нажимай <b>Д</b> или <b>М</b> на карточке места.</div>';
  }else{
    shown=pool;
    list.innerHTML=shown.length?shown.map(cardHtml).join(''):'<div class="empty">Ничего не нашлось.<br>Попробуй другое слово или сбрось фильтр.</div>';
  }

  fillImgs(list);
  list.querySelectorAll('.card').forEach(c=>{
    c.onclick=()=>{const p=byId[c.dataset.id];map.flyTo([p.lat,p.lng],p.c==='За городом'?10:15,{duration:.8});markers[p.id].openPopup();highlight(p.id)};
    c.querySelectorAll('.hearts button').forEach(b=>b.onclick=e=>{e.stopPropagation();toggle(c.dataset.id,b.dataset.p)});
  });

  // маркеры: показываем ровно то, что в списке
  const vis=new Set(shown.map(p=>p.id));
  PLACES.forEach(p=>{
    const mk=markers[p.id];mk.setIcon(icon(p.id));
    const show=vis.has(p.id);
    if(show&&!map.hasLayer(mk))mk.addTo(map);
    if(!show&&map.hasLayer(mk)){mk.closePopup();map.removeLayer(mk)}
  });

  // счётчики
  let cd=0,cm=0,cb=0;
  PLACES.forEach(p=>{const v=st(p.id);if(v.d)cd++;if(v.m)cm++;if(v.d&&v.m)cb++});
  document.getElementById('cd').textContent=cd;
  document.getElementById('cm').textContent=cm;
  document.getElementById('cb').textContent=cb;
  document.getElementById('nAll').textContent=PLACES.length;
  const fav=PLACES.filter(p=>st(p.id).d||st(p.id).m).length;
  document.getElementById('nFav').textContent=fav||'';
}

/* ───────── управление ───────── */
document.querySelectorAll('.viewtabs button').forEach(b=>b.onclick=()=>{
  view=b.dataset.v;
  document.querySelectorAll('.viewtabs button').forEach(x=>x.classList.toggle('on',x===b));
  render();
});
document.querySelectorAll('.who button[data-p]').forEach(b=>b.onclick=()=>{
  who=b.dataset.p;
  try{localStorage.setItem(WHOKEY,who)}catch(e){}
  document.querySelectorAll('.who button[data-p]').forEach(x=>x.classList.toggle('on',x===b));
});
let qt;document.getElementById('q').oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{q=e.target.value.trim().toLowerCase();render()},180)};

document.getElementById('exp').onclick=async()=>{
  const f=t=>PLACES.filter(t).map(p=>'• '+p.n+' — '+p.c);
  const both=f(p=>st(p.id).d&&st(p.id).m);
  const d=f(p=>st(p.id).d&&!st(p.id).m);
  const m=f(p=>st(p.id).m&&!st(p.id).d);
  const txt=`МАДРИД — наш список\n\nХОТИМ ОБА (${both.length}):\n${both.join('\n')||'—'}\n\nТОЛЬКО ДАНИИЛ (${d.length}):\n${d.join('\n')||'—'}\n\nТОЛЬКО МИЛЕНА (${m.length}):\n${m.join('\n')||'—'}`;
  const btn=document.getElementById('exp');
  try{await navigator.clipboard.writeText(txt);btn.textContent='Скопировано ✓';setTimeout(()=>btn.textContent='Скопировать список',1600)}catch(e){alert(txt)}
};
document.getElementById('share').onclick=async()=>{
  const u=CLOUD?location.origin+location.pathname:location.origin+location.pathname+'#'+enc();
  const btn=document.getElementById('share');
  try{await navigator.clipboard.writeText(u);btn.textContent='Скопировано ✓';setTimeout(()=>btn.textContent='Ссылка',1600)}catch(e){prompt('Ссылка:',u)}
};

/* шторка на телефоне */
(function(){
  const a=document.querySelector('aside'),states=['min','','big'];let i=1;
  a.addEventListener('click',e=>{const r=a.getBoundingClientRect();if(e.clientY-r.top<20){i=(i+1)%3;a.className=states[i]}});
  let y0=null;
  a.addEventListener('touchstart',e=>{const r=a.getBoundingClientRect();y0=(e.touches[0].clientY-r.top<28)?e.touches[0].clientY:null},{passive:true});
  a.addEventListener('touchend',e=>{if(y0===null)return;const dy=e.changedTouches[0].clientY-y0;if(dy<-40&&i<2)i++;else if(dy>40&&i>0)i--;a.className=states[i];y0=null});
})();
map.on('popupopen',()=>{if(innerWidth<=820)document.querySelector('aside').className='min'});

load().then(()=>{
  document.querySelectorAll('.who button[data-p]').forEach(x=>x.classList.toggle('on',x.dataset.p===who));
  render();
});
</script>
</body>
</html>
